name: Go
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Check out code
      uses: actions/checkout@v5
    - name: Format check
      run: |
        # Check tracked .go files, excluding generated code (statik embeds
        # assets and does not emit gofmt-clean output). `|| exit 1` surfaces a
        # gofmt parse error instead of it looking clean via empty stdout.
        files=$(git ls-files '*.go' | grep -v '^assets/statik/')
        unformatted=$(gofmt -l $files) || exit 1
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-clean:"
          echo "$unformatted"
          exit 1
        fi
    - name: Build
      run: go build -v ./...
    - name: Vet
      run: go vet ./...
    - name: Install tshark
      run: sudo sh -c 'export DEBIAN_FRONTEND=noninteractive ; apt -y update && apt -y install tshark'
    - name: Test
      run: go test -v ./...
