<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termshark Web</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Termshark Web</h1>
            <div id="header-right">
                <span id="session-info" class="hidden"></span>
                <button id="stream-btn" class="small-btn hidden">Follow Stream</button>
                <button id="download-btn" class="small-btn hidden">Download PCAP</button>
                <button id="session-btn" class="small-btn">Sessions</button>
                <div id="status">Connecting...</div>
            </div>
        </header>
        <main>
            <section id="controls">
                <input type="text" id="filter" placeholder="Display filter (e.g., tcp.port == 80)">
                <button id="apply-filter">Apply</button>
                <div id="capture-controls" class="hidden">
                    <select id="interface-select">
                        <option value="">Select interface...</option>
                    </select>
                    <button id="start-capture-btn" class="capture-btn">Start Capture</button>
                    <button id="stop-capture-btn" class="capture-btn stop hidden">Stop</button>
                    <span id="capture-status" class="hidden"></span>
                </div>
                <input type="file" id="pcap-file" accept=".pcap,.pcapng,.cap">
            </section>
            <section id="packet-list">
                <table id="packets">
                    <thead>
                        <tr id="packet-header"></tr>
                    </thead>
                    <tbody id="packet-body"></tbody>
                </table>
            </section>
            <section id="details-pane">
                <div id="packet-tree"></div>
                <div id="packet-hex"></div>
            </section>
        </main>
    </div>

    <!-- Session Picker Modal -->
    <div id="session-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Sessions</h2>
                <button id="modal-close" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="session-list-container">
                    <div id="session-list"></div>
                </div>
                <div class="session-actions">
                    <input type="text" id="new-session-name" placeholder="New session name...">
                    <button id="create-session-btn">Create Session</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Stream Viewer Modal -->
    <div id="stream-modal" class="modal hidden">
        <div class="modal-content stream-modal-content">
            <div class="modal-header">
                <h2>Follow Stream</h2>
                <div class="stream-controls">
                    <select id="stream-protocol">
                        <option value="tcp">TCP</option>
                        <option value="udp">UDP</option>
                        <option value="http">HTTP</option>
                    </select>
                    <input type="number" id="stream-index" min="0" value="0" placeholder="Stream #">
                    <button id="stream-fetch-btn" class="small-btn">Fetch</button>
                    <button id="stream-view-toggle" class="small-btn">Hex View</button>
                </div>
                <button id="stream-modal-close" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="stream-content"></pre>
            </div>
        </div>
    </div>

    <script src="main.js" type="module"></script>
</body>
</html>
